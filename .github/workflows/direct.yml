name: Direct download build + emulator test
# Direct-download build of this app (GitHub Releases / charleshartmann.com): same code, built with store=direct
# (no Google Play links, no Play in-app review prompt, nothing sold through Google Play). Emulator with Google APIs (a normal phone).
# Branch builds only make a DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [direct-stripe]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: direct-${{ github.ref }}
  cancel-in-progress: true
jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: 'true'
      ADB_INSTALL_TIMEOUT: '10'
      keystore_password: ${{ secrets.STORE_PASSWORD }}
      key_alias: ${{ secrets.KEY_ALIAS }}
      key_password: ${{ secrets.KEY_PASSWORD }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
      ADMOB_NATIVE_ADVANCED_ID: ${{ secrets.ADMOB_NATIVE_ADVANCED_ID }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set CI version code
      shell: bash
      run: echo "CI_VERSION_CODE=$(( 3000 + ${{ github.run_number }} ))" >> "$GITHUB_ENV"
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
    - name: Ensure local.properties and signing files
      shell: bash
      run: |
        cat > local.properties <<EOF
        sdk.dir=${ANDROID_SDK_ROOT}
        ADMOB_APP_ID=${ADMOB_APP_ID}
        ADMOB_BANNER_ID=${ADMOB_BANNER_ID}
        ADMOB_INTERSTITIAL_ID=${ADMOB_INTERSTITIAL_ID}
        ADMOB_REWARDED_ID=${ADMOB_REWARDED_ID}
        ADMOB_NATIVE_ADVANCED_ID=${ADMOB_NATIVE_ADVANCED_ID}
        STORE_FILE=../keystore
        STORE_PASSWORD=${keystore_password}
        KEY_ALIAS=${key_alias}
        KEY_PASSWORD=${key_password}
        EOF

        echo "${{ secrets.STORE_FILE_B64 }}" | base64 -d > keystore
        echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > presentation/google-services.json
    - name: Build direct APK (store=direct)
      env: {}
      run: |
        set -o pipefail
        ./gradlew :presentation:assembleWithAnalyticsRelease -Pstore=direct --stacktrace 2>&1 | tee -a /tmp/dsk-build.log
        cd "$GITHUB_WORKSPACE"
        mkdir -p dsk-apk
        A=$(find presentation/build/outputs/apk/withAnalytics/release -name "*.apk" ! -name "*unsigned*" | head -1)
        cp "$A" dsk-apk/TextPilot-direct-release.apk
        ls -la dsk-apk
        BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
        $BT/apksigner verify --print-certs dsk-apk/TextPilot-direct-release.apk | head -3 || true
        $BT/aapt2 dump badging dsk-apk/TextPilot-direct-release.apk | head -3 || true
        echo "--- Play Store URL strings left in the direct release dex:"; unzip -p dsk-apk/TextPilot-direct-release.apk "classes*.dex" | strings | grep -E "play\.google\.com/store|market://" | head || true
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        tail -c 60000 /tmp/dsk-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/dsklog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
    - name: Emulator test (Google APIs image, like a normal phone)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        profile: pixel_5
        target: google_apis
        arch: x86_64
        ram-size: 3072M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: bash .github/direct/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        bash .github/direct/direct-upload.sh /tmp/dsk-out dsk_TextPilot_r${{ github.run_number }}
    - name: Draft release with the direct APK (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: direct-${{ github.run_number }}
        name: Direct build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: dsk-apk/TextPilot-direct-release.apk
