name: Android Release E2E

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      CI_VERSION_CODE: ${{ github.run_number }}
      keystore_password: ${{ secrets.STORE_PASSWORD }}
      key_alias: ${{ secrets.KEY_ALIAS }}
      key_password: ${{ secrets.KEY_PASSWORD }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
      ADMOB_NATIVE_ADVANCED_ID: ${{ secrets.ADMOB_NATIVE_ADVANCED_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Ensure local.properties and signing files
        shell: bash
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          ADMOB_APP_ID=${ADMOB_APP_ID}
          ADMOB_BANNER_ID=${ADMOB_BANNER_ID}
          ADMOB_INTERSTITIAL_ID=${ADMOB_INTERSTITIAL_ID}
          ADMOB_REWARDED_ID=${ADMOB_REWARDED_ID}
          ADMOB_NATIVE_ADVANCED_ID=${ADMOB_NATIVE_ADVANCED_ID}
          STORE_FILE=../keystore
          STORE_PASSWORD=${keystore_password}
          KEY_ALIAS=${key_alias}
          KEY_PASSWORD=${key_password}
          EOF

          echo "${{ secrets.STORE_FILE_B64 }}" | base64 -d > keystore
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > presentation/google-services.json

      - name: Build release artifacts
        run: ./gradlew :presentation:assembleWithAnalyticsRelease :presentation:bundleWithAnalyticsRelease --stacktrace

      - name: Run instrumentation tests on emulator (attempt 1)
        id: emulator_tests_1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 2048
          disable-animations: false
          script: |
            set -euo pipefail

            wait_for_emulator_ready() {
              local deadline=$((SECONDS + 420))
              while (( SECONDS < deadline )); do
                adb wait-for-device || true
                local boot
                boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
                local sdk
                sdk="$(adb shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r' || true)"

                if [ "${boot}" = "1" ] && [[ "${sdk}" =~ ^[0-9]+$ ]]; then
                  if adb shell cmd package list packages >/dev/null 2>&1; then
                    echo "Emulator ready (sdk=${sdk})"
                    adb devices -l
                    adb shell getprop ro.build.version.release || true
                    adb shell getprop ro.build.version.sdk || true
                    return 0
                  fi
                fi

                # Recover from transient adb/device stalls seen in CI.
                adb reconnect offline >/dev/null 2>&1 || true
                sleep 5
              done

              echo "Timed out waiting for emulator readiness"
              adb devices -l || true
              return 1
            }

            run_connected_tests() {
              ./gradlew :presentation:connectedNoAnalyticsDebugAndroidTest \
                -Pandroid.experimental.androidTest.useUnifiedTestPlatform=false \
                --stacktrace --no-daemon
            }

            wait_for_emulator_ready
            run_connected_tests || {
              echo "First test invocation failed; restarting adb and retrying once in-attempt"
              adb kill-server || true
              sleep 2
              adb start-server
              wait_for_emulator_ready
              run_connected_tests
            }

      - name: Run instrumentation tests on emulator (attempt 2)
        id: emulator_tests_2
        if: steps.emulator_tests_1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 2048
          disable-animations: false
          script: |
            set -euo pipefail

            wait_for_emulator_ready() {
              local deadline=$((SECONDS + 420))
              while (( SECONDS < deadline )); do
                adb wait-for-device || true
                local boot
                boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
                local sdk
                sdk="$(adb shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r' || true)"

                if [ "${boot}" = "1" ] && [[ "${sdk}" =~ ^[0-9]+$ ]]; then
                  if adb shell cmd package list packages >/dev/null 2>&1; then
                    echo "Emulator ready (sdk=${sdk})"
                    adb devices -l
                    adb shell getprop ro.build.version.release || true
                    adb shell getprop ro.build.version.sdk || true
                    return 0
                  fi
                fi

                adb reconnect offline >/dev/null 2>&1 || true
                sleep 5
              done

              echo "Timed out waiting for emulator readiness"
              adb devices -l || true
              return 1
            }

            run_connected_tests() {
              ./gradlew :presentation:connectedNoAnalyticsDebugAndroidTest \
                -Pandroid.experimental.androidTest.useUnifiedTestPlatform=false \
                --stacktrace --no-daemon
            }

            wait_for_emulator_ready
            run_connected_tests || {
              echo "First test invocation failed; restarting adb and retrying once in-attempt"
              adb kill-server || true
              sleep 2
              adb start-server
              wait_for_emulator_ready
              run_connected_tests
            }

      - name: Fail if emulator tests failed twice
        if: steps.emulator_tests_1.outcome == 'failure' && steps.emulator_tests_2.outcome == 'failure'
        shell: bash
        run: |
          echo "Instrumentation tests failed on both emulator attempts."
          exit 1

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: withanalytics-release-artifacts-${{ github.sha }}
          path: |
            presentation/build/outputs/apk/withAnalytics/release/*.apk
            presentation/build/outputs/bundle/withAnalyticsRelease/*.aab

      - name: Build release tag metadata
        id: release_meta
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "tag=ci-${BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "name=CI Release ${GITHUB_REF_NAME} ${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create or update CI GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          allowUpdates: true
          removeArtifacts: true
          prerelease: false
          artifactErrorsFailBuild: true
          artifacts: |
            presentation/build/outputs/apk/withAnalytics/release/*.apk
            presentation/build/outputs/bundle/withAnalyticsRelease/*.aab
