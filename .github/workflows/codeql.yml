name: CodeQL

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ java-kotlin ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Create local.properties (stub for CodeQL build)
        run: |
          cat > local.properties <<'EOF'
          sdk.dir=/usr/local/lib/android/sdk
          GITHUB_API_TOKEN=stub
          GITHUB_REPO_OWNER=stub
          GITHUB_REPO_NAME=stub
          ADMOB_APP_ID=ca-app-pub-0000000000000000~0000000000
          ADMOB_BANNER_ID=ca-app-pub-0000000000000000/0000000000
          ADMOB_INTERSTITIAL_ID=ca-app-pub-0000000000000000/0000000000
          ADMOB_REWARDED_ID=ca-app-pub-0000000000000000/0000000000
          ADMOB_NATIVE_ADVANCED_ID=ca-app-pub-0000000000000000/0000000000
          EOF

      - name: Build (noAnalytics debug for CodeQL)
        run: ./gradlew :presentation:compileNoAnalyticsDebugSources --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
