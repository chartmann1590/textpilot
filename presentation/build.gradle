apply plugin: 'com.android.application'
apply plugin: 'realm-android' // Realm needs to be before Kotlin or the build will fail
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
// Google services plugins are conditionally applied at the bottom of this file

android {
    namespace "com.charles.messenger"
    compileSdk 36
    flavorDimensions "analytics"

    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        localProperties.load(new FileInputStream(localPropertiesFile))
    }

    def androidVersionCodeEnv = System.getenv("ANDROID_VERSION_CODE")
    def ciVersionCodeEnv = System.getenv("CI_VERSION_CODE")
    def resolvedVersionCodeStr = (androidVersionCodeEnv ?: ciVersionCodeEnv)?.toString()?.trim()
    def resolvedVersionCode = resolvedVersionCodeStr?.isInteger() ? resolvedVersionCodeStr.toInteger() : 3000

    def androidVersionNameEnv = System.getenv("ANDROID_VERSION_NAME")
    def resolvedVersionName = androidVersionNameEnv ?: "3.10.2"

    defaultConfig {

        configurations.all {
            resolutionStrategy { force 'androidx.core:core-ktx:1.6.0' }
        }

        applicationId "com.charles.messenger.v2"
        minSdk 21
        targetSdk 36
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        setProperty("archivesBaseName", "messenger-v${versionName}-${resolvedVersionCode}")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        multiDexKeepProguard file('multidex-config.pro')

        // AdMob IDs
        def admobInterstitialId = 'ca-app-pub-8382831211800454/9644132901'
        def admobRewardedId = 'ca-app-pub-8382831211800454/9644132901'
        def admobBannerId = 'ca-app-pub-8382831211800454/3331763582'
        def admobNativeAdvancedId = 'ca-app-pub-8382831211800454/5704887899'
        def admobAppId = 'ca-app-pub-8382831211800454~8831502279'

        buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"" + admobInterstitialId + "\""
        buildConfigField "String", "ADMOB_REWARDED_ID", "\"" + admobRewardedId + "\""
        buildConfigField "Boolean", "USE_TEST_ADS", "false"

        resValue "string", "admob_banner_id", "\"" + admobBannerId + "\""
        resValue "string", "admob_native_advanced_id", "\"" + admobNativeAdvancedId + "\""
        manifestPlaceholders = [ADMOB_APP_ID: admobAppId]
    }

    signingConfigs {
        release
    }

    buildTypes {
        debug {
            // Use configured AdMob IDs for debug builds
            buildConfigField "Boolean", "USE_TEST_ADS", "true"
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-8382831211800454/9644132901\""
            buildConfigField "String", "ADMOB_REWARDED_ID", "\"ca-app-pub-8382831211800454/9644132901\""
            resValue "string", "admob_banner_id", "ca-app-pub-8382831211800454/3331763582"
            resValue "string", "admob_native_advanced_id", "ca-app-pub-8382831211800454/5704887899"
            manifestPlaceholders = [ADMOB_APP_ID: "ca-app-pub-8382831211800454~8831502279"]
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // Use production ad IDs (already set in defaultConfig)
            buildConfigField "Boolean", "USE_TEST_ADS", "false"
        }
    }

    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
    }

    kotlinOptions {
        jvmTarget = "1.8"
        // Allow using libraries compiled with a newer Kotlin metadata version (Firebase 21.5.0)
        freeCompilerArgs += "-Xskip-metadata-version-check"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    productFlavors {
        withAnalytics { dimension "analytics" }
        noAnalytics { dimension "analytics" }
    }

    if (System.getenv("CI") == "true") {
        signingConfigs.release.storeFile = file("../keystore")
        signingConfigs.release.storePassword = System.getenv("keystore_password")
        signingConfigs.release.keyAlias = System.getenv("key_alias")
        signingConfigs.release.keyPassword = System.getenv("key_password")
    } else if (localProperties.containsKey('STORE_FILE')) {
        signingConfigs.release.storeFile = file(localProperties['STORE_FILE'])
        signingConfigs.release.storePassword = localProperties['STORE_PASSWORD']
        signingConfigs.release.keyAlias = localProperties['KEY_ALIAS']
        signingConfigs.release.keyPassword = localProperties['KEY_PASSWORD']
    }
}

configurations {
    noAnalyticsDebug
    noAnalyticsRelease
    withAnalyticsDebug
    withAnalyticsRelease
}

dependencies {
    // lifecycle
    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

    // androidx
    implementation "androidx.appcompat:appcompat:$androidx_appcompat_version"
    implementation "androidx.constraintlayout:constraintlayout:$androidx_constraintlayout_version"
    implementation "androidx.core:core-ktx:$androidx_core_version"
    implementation "androidx.emoji:emoji-appcompat:$androidx_emoji_version"
    implementation "androidx.viewpager2:viewpager2:$androidx_viewpager_version"
    implementation "com.google.android.material:material:$material_version"
    implementation "androidx.multidex:multidex:2.0.1"

    // conductor
    implementation "com.bluelinelabs:conductor:$conductor_version"
    implementation "com.bluelinelabs:conductor-archlifecycle:$conductor_version"

    // glide
    implementation "com.github.bumptech.glide:glide:$glide_version"
    implementation 'com.google.android.gms:play-services-basement:18.3.0'
    kapt "com.github.bumptech.glide:compiler:$glide_version"

    // exoplayer
    implementation "com.google.android.exoplayer:exoplayer-core:$exoplayer_version"
    implementation("com.google.android.exoplayer:exoplayer-ui:$exoplayer_version", {
        exclude group: "com.android.support", module: "support-media-compat"
    })

    // rxbinding
    implementation "com.jakewharton.rxbinding2:rxbinding-kotlin:$rxbinding_version"
    implementation "com.jakewharton.rxbinding2:rxbinding-support-v4-kotlin:$rxbinding_version"

    // autodispose
    implementation "com.uber.autodispose:autodispose-android-archcomponents:$autodispose_version"
    implementation "com.uber.autodispose:autodispose-android-archcomponents-test:$autodispose_version"
    implementation "com.uber.autodispose:autodispose-android:$autodispose_version"
    implementation "com.uber.autodispose:autodispose:$autodispose_version"
    implementation "com.uber.autodispose:autodispose-lifecycle:$autodispose_version"

    // dagger
    implementation "com.google.dagger:dagger:$dagger_version"
    implementation "com.google.dagger:dagger-android-support:$dagger_version"
    kapt "com.google.dagger:dagger-compiler:$dagger_version"
    kapt "com.google.dagger:dagger-android-processor:$dagger_version"
    compileOnly "javax.annotation:jsr250-api:1.0"

    // ezvcard
    implementation('com.googlecode.ez-vcard:ez-vcard:0.10.4', {
        exclude group: "org.jsoup", module: "jsoup"
        exclude group: "org.freemarker", module: "freemarker"
        exclude group: "com.fasterxml.jackson.core", module: "jackson-core"
    })

    // realm
    // implementation("io.realm:android-adapters:$realm_adapters_version") { transitive = false }
    kapt "io.realm:realm-annotations:$realm_version"
    kapt "io.realm:realm-annotations-processor:$realm_version"

    // rxjava
    implementation "io.reactivex.rxjava2:rxandroid:$rxandroid_version"
    implementation "io.reactivex.rxjava2:rxjava:$rxjava_version"
    implementation "io.reactivex.rxjava2:rxkotlin:$rxkotlin_version"
    implementation "com.uber.rxdogtag:rxdogtag:$rxdogtag_version"
    implementation "com.uber.rxdogtag:rxdogtag-autodispose:$rxdogtag_version"


    // testing
    androidTestImplementation("androidx.test.espresso:espresso-core:$espresso_version", {
        exclude group: "com.android.support", module: "support-annotations"
    })
    androidTestImplementation "org.mockito:mockito-android:$mockito_version"
    testImplementation "androidx.test:runner:$androidx_testrunner_version"
    testImplementation "junit:junit:$junit_version"
    testImplementation "org.mockito:mockito-core:$mockito_version"

    // moshi
    implementation "com.squareup.moshi:moshi:$moshi_version"
    debugImplementation "com.squareup.moshi:moshi-kotlin:$moshi_version"
    kaptRelease "com.squareup.moshi:moshi-kotlin-codegen:$moshi_version"

    // coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-rx2:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-reactive:$coroutines_version"

    implementation "com.github.chrisbanes:PhotoView:2.0.0"
    implementation "com.f2prateek.rx.preferences2:rx-preferences:$rx_preferences_version"
    implementation "com.google.android.flexbox:flexbox:3.0.0"
    implementation "com.jakewharton.timber:timber:$timber_version"
    implementation "com.squareup.moshi:moshi-kotlin:$moshi_version"
    implementation "com.squareup.okhttp3:okhttp:$okhttp3_version"
    implementation "me.leolin:ShortcutBadger:1.1.22"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation project(":android-smsmms")
    implementation project(":common")
    implementation project(':data')
    implementation project(':domain')

    withAnalyticsImplementation "com.android.billingclient:billing:$billing_version"
    withAnalyticsImplementation "com.android.billingclient:billing-ktx:$billing_version"
    noAnalyticsDebug project(path: ':data', configuration: 'noAnalyticsDebug')
    noAnalyticsRelease project(path: ':data', configuration: 'noAnalyticsRelease')
    withAnalyticsDebug project(path: ':data', configuration: 'withAnalyticsDebug')
    withAnalyticsRelease project(path: ':data', configuration: 'withAnalyticsRelease')

    withAnalyticsImplementation platform('com.google.firebase:firebase-bom:32.7.1')
    withAnalyticsImplementation 'com.google.firebase:firebase-analytics-ktx'
    withAnalyticsImplementation 'com.google.firebase:firebase-crashlytics-ktx'
    withAnalyticsImplementation 'com.google.firebase:firebase-perf-ktx'
    // withAnalyticsImplementation 'com.google.firebase:firebase-analytics-ktx:20.0.2'

    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    implementation 'com.google.android.play:review-ktx:2.0.2'
}

// Only apply Google services plugins for withAnalytics flavor
if (getGradle().getStartParameter().getTaskRequests().toString().toLowerCase().contains("withanalytics")) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
    apply plugin: 'com.google.firebase.firebase-perf'
}
